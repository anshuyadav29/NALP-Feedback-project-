# Reverse proxy for the Issue Tracker.
#
# Accepts any host name (default_server) so the tracker stays reachable both as
# issue-tracker.raspi01.local and directly by IP — mDNS resolution for a
# two-label .local name is not guaranteed on every client. Host validation is not
# skipped, it just happens in the application: MCP_ALLOWED_HOSTS lists the names
# that are accepted, and CORS is restricted there too.

upstream issue_tracker {
    server app:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Task descriptions go up to 10000 characters; this leaves ample headroom.
    client_max_body_size 4m;

    access_log /var/log/nginx/issue-tracker.access.log;
    error_log /var/log/nginx/issue-tracker.error.log warn;

    # The MCP endpoint streams Server-Sent Events and keeps requests open while a
    # confirmation dialog waits for the user. Two settings are essential here:
    # buffering would hold responses back until the stream ends, and the default
    # 60s read timeout would cut off any dialog the user does not answer at once
    # — the server allows five minutes for those.
    location /mcp {
        proxy_pass http://issue_tracker;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://issue_tracker;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
